<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NAGASHI — 需要ヒートマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0A0F1A;        /* 夜のアスファルト */
    --panel:#111827E6;        /* 半透明パネル */
    --line:#26314A;
    --andon:#FFB020;          /* 行灯アンバー */
    --andon-dim:#8A6410;
    --ink:#E8ECF4;
    --muted:#8A94A6;
    --alert:#F0524D;
    --ok:#3DD68C;
    --rain:#5AA7F0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--asphalt);font-family:'Noto Sans JP',sans-serif;color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0;background:var(--asphalt)}
  .leaflet-container{background:var(--asphalt)}

  /* ===== 上部ステータスバー ===== */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:linear-gradient(180deg,rgba(10,15,26,.92),rgba(10,15,26,0));
    pointer-events:none;
  }
  .clock{
    pointer-events:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;backdrop-filter:blur(8px);
    display:flex;align-items:baseline;gap:8px;
  }
  .clock .t{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:.02em}
  .clock .d{font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:500;backdrop-filter:blur(8px);
    cursor:pointer;user-select:none;transition:border-color .2s;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .chip.warn .dot{background:var(--alert);animation:blink 1.2s infinite}
  .chip.rain-on{border-color:var(--rain);color:#CFE6FB}
  .chip.rain-on .dot{background:var(--rain)}
  @keyframes blink{50%{opacity:.25}}

  /* ===== 行灯ロゴ ===== */
  .andon{
    pointer-events:auto;margin-left:auto;
    background:linear-gradient(180deg,#2A2008,#171204);
    border:1px solid var(--andon-dim);border-radius:8px;padding:7px 12px;
    font-weight:900;font-size:13px;letter-spacing:.18em;color:var(--andon);
    text-shadow:0 0 12px rgba(255,176,32,.55);
    box-shadow:0 0 18px rgba(255,176,32,.18), inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ===== 下部パネル ===== */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:linear-gradient(0deg,rgba(10,15,26,.97) 70%,rgba(10,15,26,0));
    padding:26px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .sheet-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

  /* アラートカード */
  .alerts{display:flex;flex-direction:column;gap:8px;max-height:158px;overflow-y:auto}
  .card{
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);
    border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:flex-start;
    animation:slidein .35s ease;
  }
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card.lv-alert{border-left-color:var(--alert)}
  .card.lv-event{border-left-color:var(--andon)}
  .card.lv-rain{border-left-color:var(--rain)}
  .card .icon{font-size:18px;line-height:1.3}
  .card .body{flex:1;min-width:0}
  .card h3{font-size:13px;font-weight:700;margin-bottom:2px}
  .card p{font-size:12px;color:var(--muted);line-height:1.5}
  .card .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    color:var(--andon);white-space:nowrap;
  }
  .card.lv-alert .tag{color:var(--alert)}
  .card.lv-rain .tag{color:var(--rain)}
  .empty{
    text-align:center;font-size:12px;color:var(--muted);padding:10px;
    background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  }

  /* 時間スライダー */
  .timebox{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;backdrop-filter:blur(8px);
  }
  .timebox .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .timebox label{font-size:11px;color:var(--muted);letter-spacing:.08em}
  .timebox .phase{font-size:11px;font-weight:700;color:var(--andon)}
  input[type=range]{
    width:100%;appearance:none;height:6px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#1B2A45 0%,#3A2E10 55%,#5C1E1C 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#FFD574,var(--andon) 60%,#B87A0E);
    border:2px solid #0A0F1A;box-shadow:0 0 14px rgba(255,176,32,.6);cursor:pointer;
  }
  .ticks{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
    font-size:10px;color:var(--muted);margin-top:6px}

  /* 会場マーカー */
  .venue-pin{position:relative}
  .venue-pin .ring{
    position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--andon);transform:translate(-50%,-50%);
    animation:pulse 1.8s ease-out infinite;
  }
  .venue-pin .core{
    position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;
    background:var(--andon);transform:translate(-50%,-50%);
    box-shadow:0 0 10px rgba(255,176,32,.8);
  }
  .venue-pin.calm .ring{display:none}
  .venue-pin.calm .core{background:#5A6478;box-shadow:none;opacity:.55}
  @keyframes pulse{
    0%{width:14px;height:14px;opacity:.9}
    100%{width:52px;height:52px;opacity:0}
  }
  .leaflet-popup-content-wrapper{
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(8px);font-family:'Noto Sans JP',sans-serif;
  }
  .leaflet-popup-tip{background:#111827}
  .pop h4{font-size:13px;margin-bottom:3px}
  .pop p{font-size:11px;color:var(--muted);line-height:1.5}
  .pop .cnt{font-family:'IBM Plex Mono',monospace;color:var(--andon);font-weight:600}

  .leaflet-control-attribution{background:rgba(10,15,26,.7)!important;color:#5A6478!important;font-size:9px!important}
  .leaflet-control-attribution a{color:#5A6478!important}
  .leaflet-control-zoom{display:none}
  @media (prefers-reduced-motion:reduce){
    .venue-pin .ring,.chip.warn .dot{animation:none}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="clock"><span class="t" id="clock">19:00</span><span class="d">木曜・シミュレーション</span></div>
  <div class="chips">
    <div class="chip" id="chip-transit"><span class="dot"></span><span id="chip-transit-txt">運行 平常</span></div>
    <div class="chip" id="chip-rain"><span class="dot"></span><span id="chip-rain-txt">☂ 雨を降らせる</span></div>
  </div>
  <div class="andon">NAGASHI</div>
</div>

<div class="sheet">
  <div class="sheet-inner">
    <div class="alerts" id="alerts"></div>
    <div class="timebox">
      <div class="row">
        <label>今夜をシミュレート</label>
        <span class="phase" id="phase">宵の口 — ベース需要</span>
      </div>
      <input type="range" id="slider" min="0" max="450" step="5" value="60" aria-label="時刻シミュレーター">
      <div class="ticks"><span>18:00</span><span>20:00</span><span>22:00</span><span>0:00</span><span>1:30</span></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
/* ================= 地図 ================= */
const map = L.map('map',{zoomControl:false, attributionControl:true})
  .setView([35.687, 139.735], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:18
}).addTo(map);

/* ================= モックデータ ================= */
// t = 18:00 からの経過分(0〜450 = 18:00〜1:30)
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bell=(t,peak,width)=>Math.exp(-((t-peak)**2)/(2*width*width)); // ガウス型ピーク

// 繁華街ベース需要:深夜に向けて上昇、終電後に急騰
const nightlife=[
  {name:'新宿・歌舞伎町', lat:35.6946, lng:139.7020, k:1.0, last:390}, // 終電 0:30
  {name:'渋谷',           lat:35.6595, lng:139.7005, k:0.95,last:395},
  {name:'六本木',         lat:35.6627, lng:139.7313, k:0.8, last:370},
  {name:'銀座・新橋',     lat:35.6685, lng:139.7595, k:0.75,last:380},
  {name:'池袋',           lat:35.7295, lng:139.7109, k:0.7, last:400},
  {name:'上野',           lat:35.7106, lng:139.7772, k:0.5, last:385},
  {name:'恵比寿',         lat:35.6467, lng:139.7101, k:0.5, last:375},
];
function nightScore(spot,t){
  const rise = clamp((t-90)/240,0,1)*0.55;              // 19:30以降じわ上げ
  const lastTrain = t>spot.last ? bell(t,spot.last+35,45)*1.6 : 0; // 終電後スパイク
  return spot.k*(0.18+rise+lastTrain);
}

// イベント会場
const venues=[
  {name:'東京ドーム',   lat:35.7056, lng:139.7519, cap:'55,000人', end:180, note:'水道橋・春日通り側で待機推奨', st:'水道橋駅'},
  {name:'国立競技場',   lat:35.6779, lng:139.7146, cap:'68,000人', end:210, note:'外苑西通りは規制あり。千駄ヶ谷側へ', st:'千駄ヶ谷駅'},
  {name:'日本武道館',   lat:35.6934, lng:139.7499, cap:'14,000人', end:150, note:'九段下交差点の靖国通り側', st:'九段下駅'},
];
function venueScore(v,t){ return 2.0*bell(t, v.end+18, 30); } // 終演直後にピーク

// 運行障害シナリオ:中央線 19:30〜20:40 運転見合わせ
const disruption={line:'JR中央線(快速)', start:90, end:160,
  stations:[
    {name:'中野',   lat:35.7074, lng:139.6659},
    {name:'荻窪',   lat:35.7048, lng:139.6203},
    {name:'吉祥寺', lat:35.7031, lng:139.5797},
  ]};
function disruptScore(t){
  if(t<disruption.start) return 0;
  if(t<=disruption.end) return 1.7*clamp((t-disruption.start)/20,0,1);
  return 1.7*Math.exp(-(t-disruption.end)/25); // 解除後は減衰
}

// 雨:オフィス街の帰宅需要(18:00〜21:00に効く)
const offices=[
  {name:'大手町・丸の内', lat:35.6845, lng:139.7645},
  {name:'品川',           lat:35.6285, lng:139.7388},
  {name:'霞が関',         lat:35.6739, lng:139.7520},
];
function rainScore(t){ return 1.3*bell(t,60,80); } // 19:00頃ピーク

/* ================= ヒートレイヤー ================= */
let heat = L.heatLayer([],{radius:34, blur:26, maxZoom:15, max:1.0,
  gradient:{0.15:'#123B6D',0.35:'#0E7C8C',0.55:'#E3B341',0.75:'#F07818',0.95:'#E5383B'}
}).addTo(map);

const jitter=(base,n,spread,w)=>{
  const pts=[];
  for(let i=0;i<n;i++){
    pts.push([ base.lat+(Math.random()-0.5)*spread,
               base.lng+(Math.random()-0.5)*spread*1.25,
               w*(0.6+Math.random()*0.4) ]);
  }
  return pts;
};

let rainOn=false;
function rebuild(t){
  let pts=[];
  nightlife.forEach(s=>{ const w=nightScore(s,t); if(w>0.05) pts=pts.concat(jitter(s,14,0.012,clamp(w,0,1))); });
  venues.forEach(v=>{ const w=venueScore(v,t); if(w>0.08) pts=pts.concat(jitter(v,18,0.008,clamp(w,0,1))); });
  const d=disruptScore(t);
  if(d>0.08) disruption.stations.forEach(s=> pts=pts.concat(jitter(s,12,0.009,clamp(d,0,1))));
  if(rainOn){ const w=rainScore(t); if(w>0.08) offices.forEach(o=> pts=pts.concat(jitter(o,12,0.010,clamp(w,0,1)))); }
  heat.setLatLngs(pts);
}

/* ================= 会場マーカー ================= */
const venueMarkers = venues.map(v=>{
  const icon=L.divIcon({className:'', html:'<div class="venue-pin calm"><div class="ring"></div><div class="core"></div></div>', iconSize:[1,1]});
  const m=L.marker([v.lat,v.lng],{icon}).addTo(map);
  m._venue=v;
  return m;
});
function fmtMin(m){ const h=Math.floor(m/60), mm=m%60; return (h>0?h+'時間':'')+mm+'分'; }
function updateMarkers(t){
  venueMarkers.forEach(mk=>{
    const v=mk._venue, dt=v.end-t;
    const active = dt<=45 && dt>-50;
    mk.getElement().querySelector('.venue-pin').classList.toggle('calm',!active);
    let status;
    if(dt>0) status=`終演まで <span class="cnt">${fmtMin(dt)}</span>`;
    else if(dt>-50) status=`<span class="cnt">終演直後 — 需要ピーク</span>`;
    else status='本日の需要ピークは終了';
    mk.bindPopup(`<div class="pop"><h4>${v.name}</h4><p>収容 ${v.cap} ・ 最寄 ${v.st}<br>${status}<br>${v.note}</p></div>`);
  });
}

/* ================= アラート ================= */
const alertsEl=document.getElementById('alerts');
function card(lv,icon,title,body,tag){
  return `<div class="card lv-${lv}"><div class="icon">${icon}</div>
    <div class="body"><h3>${title}</h3><p>${body}</p></div>
    <div class="tag">${tag}</div></div>`;
}
function updateAlerts(t){
  const list=[];
  const d=disruptScore(t);
  if(t>=disruption.start && t<=disruption.end){
    list.push(card('alert','🚨','中央線 運転見合わせ','中野・荻窪・吉祥寺の駅前で需要急増中。青梅街道側からの進入が渋滞回避に有効。','検知 19:30'));
  } else if(d>0.1){
    list.push(card('alert','⚠️','中央線 運転再開','残留需要が減衰中。駅前の待機列は15〜20分で解消見込み。','解除 20:40'));
  }
  venues.forEach(v=>{
    const dt=v.end-t;
    if(dt<=40 && dt>0) list.push(card('event','🎤',`${v.name} まもなく終演`,`収容${v.cap}。${v.note}。`,`あと${fmtMin(dt)}`));
    else if(dt<=0 && dt>-45) list.push(card('event','🔥',`${v.name} 終演`,`需要ピーク中。${v.note}。`,'今すぐ'));
  });
  if(rainOn && rainScore(t)>0.2){
    list.push(card('rain','☂️','降雨中 — 帰宅需要','大手町・丸の内・品川のオフィス街で乗車率上昇。ビルエントランス付近の流しが有効。','継続中'));
  }
  nightlife.forEach(s=>{
    const dt=s.last-t;
    if(dt<=20 && dt>0) list.push(card('event','🚉',`${s.name} 終電接近`,`終電後30〜60分が需要の山。駅から徒歩圏の飲食店街側で待機を。`,`終電まで${dt}分`));
  });
  alertsEl.innerHTML = list.length? list.join('') : '<div class="empty">現在アクティブなアラートはありません — ベース需要で流し中</div>';
}

/* ================= ステータスチップ ================= */
const chipT=document.getElementById('chip-transit');
function updateChips(t){
  const active = t>=disruption.start && t<=disruption.end;
  chipT.classList.toggle('warn',active);
  document.getElementById('chip-transit-txt').textContent = active? '中央線 見合わせ':'運行 平常';
}
document.getElementById('chip-rain').addEventListener('click',e=>{
  rainOn=!rainOn;
  e.currentTarget.classList.toggle('rain-on',rainOn);
  document.getElementById('chip-rain-txt').textContent = rainOn? '☂ 降雨中(タップで停止)':'☂ 雨を降らせる';
  refresh();
});

/* ================= 時間スライダー ================= */
const slider=document.getElementById('slider');
const phases=[[0,'宵の口 — ベース需要'],[85,'⚠ 運行障害フェーズ'],[165,'イベント終演ラッシュ'],[300,'終電前 — 繁華街上昇'],[380,'終電後 — 需要最大']];
function refresh(){
  const t=+slider.value;
  const h=Math.floor(t/60)+18, m=t%60;
  document.getElementById('clock').textContent=`${h%24}:${String(m).padStart(2,'0')}`;
  let ph=phases[0][1];
  phases.forEach(p=>{ if(t>=p[0]) ph=p[1]; });
  document.getElementById('phase').textContent=ph;
  rebuild(t); updateMarkers(t); updateAlerts(t); updateChips(t);
}
slider.addEventListener('input',refresh);
refresh();
</script>
</body>
</html>
